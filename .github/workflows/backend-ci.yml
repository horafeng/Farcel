name: 后端 CI

on:
  push:
    branches:
      - main
      - phase-2-work
      - phase-3-work
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: 构建并安装 wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel
          $wheel = Get-ChildItem -Path dist -Filter "farcel-*.whl" | Select-Object -First 1
          if ($null -eq $wheel) { throw "未生成 Farcel wheel" }
          python -m pip install --force-reinstall $wheel.FullName
          python -m pip check
      - name: 确认导入来自已安装包
        shell: pwsh
        run: |
          python -c "import pathlib, farcel; path = pathlib.Path(farcel.__file__).resolve(); print(path); assert 'site-packages' in str(path).lower(), path"
      - name: 运行全部测试
        run: python -m unittest discover -s tests
      - name: 运行公共后端示例
        run: python examples/backend_api_example.py
      - name: CLI smoke
        run: |
          python -m farcel.cli inspect examples\fmus\VanDerPol-fmi3.fmu
          python -m farcel.cli inspect examples\fmus\Feedthrough-fmi3.fmu
          python -m farcel.cli inspect examples\fmus\Clocks-fmi3.fmu
